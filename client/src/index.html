<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Andromeda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=final">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=final">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <app-root></app-root>
  <script>
    document.documentElement.style.setProperty('--random-gradient-delay', `-${Math.random() * 120}s`);
  </script>
  <script>
    window.addEventListener('error', function(e) {
      const err = document.createElement('div');
      err.style = 'position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:10px;';
      err.innerText = 'ERROR: ' + e.message;
      document.body.appendChild(err);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const err = document.createElement('div');
      err.style = 'position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:10px;';
      err.innerText = 'PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      document.body.appendChild(err);
    });
    const oldError = console.error;
    console.error = function() {
      const err = document.createElement('div');
      err.style = 'position:fixed;top:0;left:0;z-index:99999;background:darkred;color:white;padding:10px;';
      err.innerText = 'CONSOLE ERROR: ' + Array.from(arguments).join(' ');
      document.body.appendChild(err);
      oldError.apply(console, arguments);
    };
  </script>
</body>
</html>
