<app-emotion-spheres [showText]="showText" [viewMode]="viewMode" (emotionSelected)="onEmotionSelected($event)"></app-emotion-spheres>

<div class="controls-overlay" *ngIf="!isZoomed">
  <button class="btn-toggle-text" (click)="toggleText()">
    {{ showText ? 'Hide Text' : 'Show Text' }}
  </button>
  
  <div class="view-toggle" *ngIf="authService.isLoggedIn$ | async">
    <button [class.active]="viewMode === 'world'" (click)="setViewMode('world')">World</button>
    <button [class.active]="viewMode === 'me'" (click)="setViewMode('me')">Me</button>
  </div>
</div>

<div class="fab-container" #fabContainer>
  <div class="form-overlay" *ngIf="isFormVisible">
    <app-emotion-form (emotionLogStarted)="onEmotionLogStarted()" (emotionLogged)="onEmotionLogged($event)"></app-emotion-form>
  </div>
  <button class="btn-fab-circle" [class.btn-fab-close]="isFormVisible" (click)="toggleForm()">
    <div class="icon-plus"></div>
  </button>
</div>

<div class="global-toast" *ngIf="isSuccessToastVisible">
  Logged Successfully!
</div>
