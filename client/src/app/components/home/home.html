<app-emotion-spheres [showText]="showText" [viewMode]="viewMode" [currentTheme]="currentTheme" (emotionSelected)="onEmotionSelected($event)"></app-emotion-spheres>

<div class="controls-overlay-left" *ngIf="!isZoomed && !isFormVisible">
  <button class="btn-toggle-theme" (click)="toggleTheme()">
    <div *ngIf="currentTheme === 'dark'" class="icon-sun-svg"></div>
    <div *ngIf="currentTheme === 'light'" class="icon-moon-svg"></div>
  </button>
</div>

<div class="controls-overlay" *ngIf="!isZoomed && !isFormVisible">
  <button class="btn-toggle-theme" (click)="toggleText()">
    <div *ngIf="showText" class="icon-text-page-svg"></div>
    <div *ngIf="!showText" class="icon-text-page-slash-svg"></div>
  </button>
</div>

<div class="fab-container" #fabContainer>
  <div class="form-overlay" *ngIf="isFormVisible">
    <app-emotion-form [initialViewMode]="viewMode" (emotionLogStarted)="onEmotionLogStarted()" (emotionLogged)="onEmotionLogged($event)" (viewModeChanged)="setViewMode($event)"></app-emotion-form>
  </div>
  
  <div class="bottom-controls" *ngIf="!isFormVisible">
    <button *ngIf="authService.isLoggedIn$ | async" 
            class="btn-bottom-icon" 
            [class.active]="viewMode === 'world'" 
            (click)="setViewMode('world')">
      <div class="icon-globe-svg" [class.fill]="viewMode === 'world'"></div>
    </button>
    
    <button class="btn-fab-circle" (click)="toggleForm()">
      <div class="icon-plus"></div>
    </button>
    
    <button *ngIf="authService.isLoggedIn$ | async" 
            class="btn-bottom-icon" 
            [class.active]="viewMode === 'me'" 
            (click)="setViewMode('me')">
      <div class="icon-person-bottom-svg" [class.fill]="viewMode === 'me'"></div>
    </button>
  </div>

  <button *ngIf="isFormVisible" class="btn-fab-circle btn-fab-close" (click)="toggleForm()">
    <div class="icon-plus"></div>
  </button>
</div>

<div class="global-toast" *ngIf="isSuccessToastVisible">
  Logged Successfully!
</div>
