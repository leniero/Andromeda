<div class="emotion-form-wrapper" style="position: relative; width: 100%; display: flex; justify-content: center; overflow: hidden;">
  <form #formElement [formGroup]="emotionForm" (ngSubmit)="onSubmit()" class="glass-form" [class.recording-active]="isRecording" [ngClass]="morphState" [style.backgroundColor]="selectedColor || 'rgba(255, 255, 255, 0.05)'" [style.--progress]="recordProgress + '%'">
    
    <video #cameraPreview autoplay muted playsinline class="camera-preview" [class.recording]="isRecording"></video>
    
    <!-- Flip camera button shown only when camera is active -->
    <button *ngIf="isCameraActive" type="button" class="btn-flip-camera" (click)="flipCamera($event)" title="Flip Camera">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
        <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.704-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
      </svg>
    </button>
    
    <div class="emoji-preview" [class.morph-emoji]="morphState !== 'idle'" [class.recording-hide]="isRecording" style="z-index: 1;">
      {{ selectedEmotion ? emotionEmojis[selectedEmotion] : '✨' }}
    </div>

    <div class="form-contents" [class.fade-out]="morphState !== 'idle'" [class.recording-hide]="isRecording">
      <div class="form-group">
        <select formControlName="emotion">
          <option value="" disabled>Select an emotion...</option>
          <option *ngFor="let emotion of emotions" [value]="emotion">{{ emotionEmojis[emotion] }} {{ emotion }}</option>
        </select>
      </div>

      <div class="form-group">
        <input type="text" formControlName="reason" placeholder="Why are you feeling this way?">
      </div>

      <div class="form-group toggle-group" *ngIf="authService.isLoggedIn$ | async">
        <label class="toggle-label">
          <input type="checkbox" formControlName="isPublic" style="display: none;">
          <div class="toggle-track" [class.private]="!emotionForm.get('isPublic')?.value">
            <div class="toggle-thumb"></div>
            <span class="toggle-text public-text">Public</span>
            <span class="toggle-text private-text">Private</span>
          </div>
        </label>
      </div>

      <!-- Hold-to-record button -->
      <button type="button" 
              [disabled]="emotionForm.invalid || isSubmitting" 
              [class.tinted]="!!selectedColor" 
              [class.rainbow-gradient]="!selectedEmotion" 
              [class.recording]="isRecording"
              (pointerdown)="onPointerDown($event)"
              (pointerup)="onPointerUp($event)"
              (pointerleave)="onPointerUp($event)"
              (contextmenu)="$event.preventDefault()">
        {{ isSubmitting ? 'Logging...' : (isRecording ? 'Recording (Spin!)...' : 'Tap or Hold') }}
      </button>
    </div>
  </form>
</div>
