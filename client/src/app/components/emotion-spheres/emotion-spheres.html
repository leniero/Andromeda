<div #container class="visualization-wrapper" [class.blurred]="!!selectedEmotion">
  <canvas #bgCanvas class="bg-canvas"></canvas>
  <canvas #fgCanvas class="fg-canvas"></canvas>
  
  <button class="btn-fab-circle btn-close-detail" *ngIf="isInVideo" (click)="closeDetail()" aria-label="Close detail view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
