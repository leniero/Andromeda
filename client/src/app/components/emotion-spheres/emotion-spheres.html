<div #container class="visualization-wrapper" [class.blurred]="!!selectedEmotion">
  <canvas #bgCanvas class="bg-canvas"></canvas>
  <canvas #fgCanvas class="fg-canvas"></canvas>
  
  <button class="close-button" *ngIf="selectedEmotion" (click)="closeDetail()" aria-label="Close detail view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 6L6 18M6 6l12 12"></path>
    </svg>
  </button>
</div>
