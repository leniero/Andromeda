<div #container class="visualization-wrapper" [class.blurred]="!!selectedEmotion">
  <canvas #bgCanvas class="bg-canvas"></canvas>
  <canvas #fgCanvas class="fg-canvas"></canvas>
  
  <div class="fab-container btn-close-detail" *ngIf="isInVideo">
    <button class="btn-fab-circle" [class.btn-fab-close]="!isClosing" (click)="closeDetail()" aria-label="Close detail view">
      <div class="icon-plus"></div>
    </button>
  </div>
</div>
