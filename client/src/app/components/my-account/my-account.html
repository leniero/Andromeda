<div class="auth-container">
  <div class="glass-card">
    
    <div class="profile-info" *ngIf="user; else loading">
      <div class="account-info" style="display: flex; flex-direction: column; gap: 1rem; align-items: stretch; width: 100%;">
        
        <div *ngIf="lastEmotion" style="width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" [style.backgroundColor]="emotionColors[lastEmotion.emotion] || '#444'">
          {{ emotionEmojis[lastEmotion.emotion] || '😶' }}
        </div>

        <ng-container *ngIf="!isEditing; else editForm">
          <div style="text-align: center;">
            <p class="rainbow-text-gradient" style="margin: 0; font-weight: bold; font-size: 1.5rem;">@{{ user.username }}</p>
            <p style="margin: 0; margin-top: 0.25rem; color: rgba(255,255,255,0.7);">{{ user.email }}</p>
          </div>

          <button class="btn-secondary w-100" style="display: block; width: 100%" (click)="toggleEdit()">
            Edit Profile
          </button>
        </ng-container>

        <ng-template #editForm>
          <div class="form-group" style="margin-bottom: 0;">
            <input type="text" [(ngModel)]="editUsername" placeholder="Username" style="width: 100%; box-sizing: border-box; text-align: center;">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <input type="email" [(ngModel)]="editEmail" placeholder="Email" style="width: 100%; box-sizing: border-box; text-align: center;">
          </div>
          
          <div style="display: flex; gap: 0.5rem; justify-content: stretch; width: 100%;">
            <button class="btn-primary rainbow-gradient" style="flex: 1; padding: 0.75rem;" (click)="updateProfile()">Save</button>
            <button class="btn-secondary" style="flex: 1; padding: 0.75rem;" (click)="toggleEdit()">Cancel</button>
          </div>

          <div *ngIf="updateError" class="error-msg" style="text-align: center; color: #ff6b6b; font-size: 0.9rem;">{{ updateError }}</div>
        </ng-template>

        <div *ngIf="updateSuccess" class="success-msg" style="text-align: center; color: #51cf66; font-size: 0.9rem; margin-top: -0.5rem;">{{ updateSuccess }}</div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.5rem 0;" />

        <a routerLink="/change-password" class="btn-secondary" style="display: block; text-align: center; text-decoration: none; width: 100%; box-sizing: border-box;">
          Change Password
        </a>

        <button class="btn-secondary w-100" style="display: block; width: 100%" (click)="logout()">
          Logout
        </button>

        <ng-container *ngIf="!isEditing">
          <ng-container *ngIf="!isDeleting; else deleteConfirm">
            <button class="btn-danger w-100" style="display: block; width: 100%; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #ff6b6b; padding: 0.75rem; border-radius: 9999px; font-size: 1rem; cursor: pointer; transition: all 0.2s;" (click)="confirmDelete()" onmouseover="this.style.background='rgba(239, 68, 68, 0.4)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.2)'">
              Delete Account
            </button>
          </ng-container>

          <ng-template #deleteConfirm>
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; padding: 1rem; text-align: center;">
              <p style="color: #ff6b6b; margin-top: 0; margin-bottom: 1rem; font-weight: bold;">Are you absolutely sure?</p>
              <p style="color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 1rem;">This will permanently delete your entries as well. This action cannot be undone.</p>
              <div style="display: flex; gap: 0.5rem;">
                <button class="btn-secondary" style="flex: 1;" (click)="cancelDelete()">Cancel</button>
                <button class="btn-danger" style="flex: 1;" (click)="deleteAccount()">Delete</button>
              </div>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </div>

    <ng-template #loading>
      <div *ngIf="error; else spinner" class="error-msg" style="text-align: center; color: #ff6b6b;">
        {{ error }}
      </div>
      <ng-template #spinner>
        <p class="text-center">Loading profile...</p>
      </ng-template>
    </ng-template>
  </div>
</div>
