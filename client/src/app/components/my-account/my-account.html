<div class="account-loading-center" *ngIf="!user && !error">
  <div class="loader-spinner-global"></div>
</div>

<div class="account-error-center" *ngIf="!user && error">
  <div class="error-msg">{{ error }}</div>
</div>

<div class="auth-container" *ngIf="user" (click)="onBackgroundClick($event)" style="pointer-events: auto;">
  <div class="glass-card" (click)="$event.stopPropagation()">
    <div class="profile-info">
      <div class="account-info">
        
        <div class="emoji-circle">
          😶
        </div>

        <!-- VIEW MODE: show username/email + Edit button -->
        <div class="profile-display" *ngIf="!isEditing">
          <div class="profile-names">
            <p class="rainbow-text-gradient username-text">@{{ user.username }}</p>
            <p class="profile-email">{{ user.email }}</p>
          </div>
          <button class="btn-secondary btn-full" (click)="toggleEdit()">
            Edit Profile
          </button>
        </div>

        <!-- EDIT MODE: show inputs + Save/Cancel -->
        <div class="profile-edit" *ngIf="isEditing">
          <div class="form-group">
            <input type="text" [(ngModel)]="editUsername" placeholder="Username" class="form-input">
          </div>
          <div class="form-group">
            <input type="email" [(ngModel)]="editEmail" placeholder="Email" class="form-input">
          </div>
          <div class="btn-row">
            <button class="btn-primary rainbow-gradient btn-half" (click)="updateProfile()">Save</button>
            <button class="btn-secondary btn-half" (click)="toggleEdit()">Cancel</button>
          </div>
          <div *ngIf="updateError" class="error-msg">{{ updateError }}</div>
        </div>

        <div *ngIf="updateSuccess" class="success-msg">{{ updateSuccess }}</div>

        <hr class="divider" />

        <!-- These buttons always present to keep card height stable -->
        <a routerLink="/change-password" class="btn-secondary btn-full btn-link">
          Change Password
        </a>

        <button class="btn-secondary btn-full" (click)="logout()">
          Logout
        </button>

        <!-- Delete section: only visible when NOT editing -->
        <ng-container *ngIf="!isEditing">
          <button *ngIf="!isDeleting" class="btn-danger-outline btn-full" (click)="confirmDelete()">
            Delete Account
          </button>

          <div *ngIf="isDeleting" class="delete-confirm-box">
            <p class="delete-warning-title">Are you absolutely sure?</p>
            <p class="delete-warning-body">This will permanently delete your entries. This action cannot be undone.</p>
            <div class="btn-row">
              <button class="btn-secondary btn-half" (click)="cancelDelete()">Cancel</button>
              <button class="btn-danger btn-half" (click)="deleteAccount()">Delete</button>
            </div>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</div>
