<div class="auth-container">
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="glass-card">
    <h2 class="rainbow-text-gradient">Change Password</h2>
    
    <div class="form-group">
      <input type="password" id="oldPassword" formControlName="oldPassword" class="form-control" placeholder="Current password" />
    </div>

    <div class="form-group">
      <input type="password" id="newPassword" formControlName="newPassword" class="form-control" placeholder="New password" />
      <div *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.hasError('minlength')" class="error-text">
        Password must be at least 6 characters.
      </div>
    </div>

    <div class="form-group">
      <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" placeholder="Confirm new password" />
      <div *ngIf="passwordForm.hasError('mismatch')" class="error-text">
        Passwords do not match.
      </div>
    </div>

    <div *ngIf="error" class="error-msg text-center mt-3">{{ error }}</div>
    <div *ngIf="success" class="success-msg text-center mt-3">{{ success }}</div>

    <button type="submit" [disabled]="passwordForm.invalid || isSubmitting" class="btn-primary mt-3 rainbow-gradient">
      {{ isSubmitting ? 'Updating...' : 'Change Password' }}
    </button>
    <button type="button" (click)="goBack()" class="btn-secondary mt-3">
      Back to Account
    </button>
  </form>
</div>
