<!-- UNIFIED NAVBAR -->
<nav class="navbar-wrapper">
  <div class="navbar-semicircle">
    <div class="nav-links left">
      <ng-container *ngIf="!(authService.isLoggedIn$ | async)">
        <a routerLink="/login" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="auth-link">Login</a>
      </ng-container>
      <ng-container *ngIf="authService.isLoggedIn$ | async">
        <a class="icon-link" routerLink="/emotion-list" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" title="Entries">
          <div class="icon-list-bullet"></div>
        </a>
      </ng-container>
    </div>

    <div class="nav-brand" routerLink="/home" [class.active]="isHomeRoute">
      <div class="logo"></div>
    </div>

    <div class="nav-links right">
      <ng-container *ngIf="!(authService.isLoggedIn$ | async)">
        <a routerLink="/signup" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="auth-link">Sign Up</a>
      </ng-container>
      <ng-container *ngIf="authService.isLoggedIn$ | async">
        <a class="icon-link" routerLink="/my-account" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" title="Account">
          <div class="icon-person-circle"></div>
        </a>
      </ng-container>
    </div>
  </div>
</nav>
