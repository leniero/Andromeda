<div class="auth-container">
  <div class="glass-card">
    <h2 class="rainbow-text-gradient">New Password</h2>
    
    <div *ngIf="message" style="color: #4ade80; text-align: center;">{{ message }}</div>
    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form *ngIf="!message" [formGroup]="form" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <input id="password" type="password" formControlName="password" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm password">
        <small class="error-msg" *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched">
          Passwords do not match.
        </small>
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Saving...' : 'Reset Password' }}
      </button>
    </form>
    
    <div class="auth-links" style="text-align: center; margin-top: 1rem;" *ngIf="message">
      <a routerLink="/login" class="btn-primary" style="text-decoration: none; display: inline-block;">Login Now</a>
    </div>
  </div>
</div>
